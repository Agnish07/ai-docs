# backend/alembic.ini
[alembic]
# path to migration scripts (relative to this file)
script_location = alembic

# prepend sys.path with backend/ so `app` imports resolve (optional)
prepend_sys_path = .

# database URL placeholder - we expect DATABASE_URL env var to be set at runtime
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
